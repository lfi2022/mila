name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - migration/self-hosted-roadmap

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run migration:audit
      - run: npm --prefix backend run prisma:validate
      - run: docker compose config --quiet
        env:
          DATABASE_PASSWORD: ci-compose-only
          MYSQL_ROOT_PASSWORD: ci-compose-root-only
          STORAGE_ACCESS_KEY: ci-storage-only
          STORAGE_SECRET_KEY: ci-storage-secret-only

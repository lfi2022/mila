name: mila

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  NODE_ENV: ${NODE_ENV:-production}
  APP_URL: ${APP_URL:-http://localhost}
  STORAGE_ENDPOINT: http://minio:9000
  STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://storage.localhost}
  REDIS_URL: redis://redis:6379/0

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - path: ${MILA_ENV_FILE:-.env}
      required: false
  environment: *backend-environment
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    <<: *backend
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    <<: *backend
    command: ["node", "backend/dist/worker.js"]
    healthcheck:
      disable: true

  migrate:
    <<: *backend
    restart: "no"
    command: ["npm", "run", "db:migrate:deploy", "--workspace", "@mila/backend"]
    profiles: ["migrate"]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_URL:-http://localhost}
    restart: unless-stopped
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET_PRODUCT_IMAGES: ${STORAGE_BUCKET_PRODUCT_IMAGES:-product-images}
      STORAGE_BUCKET_LIST_COVERS: ${STORAGE_BUCKET_LIST_COVERS:-list-covers}
      STORAGE_BUCKET_USER_UPLOADS: ${STORAGE_BUCKET_USER_UPLOADS:-user-uploads}
      STORAGE_BUCKET_MEDIA_MESSAGES: ${STORAGE_BUCKET_MEDIA_MESSAGES:-media-messages}
      STORAGE_BUCKET_EXPORTS: ${STORAGE_BUCKET_EXPORTS:-exports}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set mila http://minio:9000 "$${STORAGE_ACCESS_KEY}" "$${STORAGE_SECRET_KEY}" &&
        mc mb --ignore-existing "mila/$${STORAGE_BUCKET_PRODUCT_IMAGES}" "mila/$${STORAGE_BUCKET_LIST_COVERS}" "mila/$${STORAGE_BUCKET_USER_UPLOADS}" "mila/$${STORAGE_BUCKET_MEDIA_MESSAGES}" "mila/$${STORAGE_BUCKET_EXPORTS}" &&
        mc anonymous set none "mila/$${STORAGE_BUCKET_PRODUCT_IMAGES}" &&
        mc anonymous set none "mila/$${STORAGE_BUCKET_LIST_COVERS}" &&
        mc anonymous set none "mila/$${STORAGE_BUCKET_USER_UPLOADS}" &&
        mc anonymous set none "mila/$${STORAGE_BUCKET_MEDIA_MESSAGES}" &&
        mc anonymous set none "mila/$${STORAGE_BUCKET_EXPORTS}"

  reverse-proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    profiles: ["local-db"]
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-mila}
      MYSQL_USER: ${DATABASE_USER:-mila}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-local-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  redis-data:
  minio-data:
  mysql-local-data:
